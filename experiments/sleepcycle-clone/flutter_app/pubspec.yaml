name: sleep_tracker
description: An original sleep-tracking app (Flutter) built from standard techniques.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  lottie: ^3.1.2                 # vector onboarding / loading animations
  just_audio: ^0.9.40           # sleep-aid audio playback
  # Enable these as you wire up the remaining device features:
  #   record: ^5.0.0              # microphone capture
  #   onnxruntime: ^1.4.1         # on-device ML (or tflite_flutter)
  #   health: ^10.0.0             # HealthKit / Health Connect
  #   in_app_purchase: ^3.2.0     # StoreKit / Play Billing
  # Native accelerometer uses a platform channel in lib/sensing (no package).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/lottie/
    - assets/audio/
    - assets/icon/
